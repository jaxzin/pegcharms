<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Through-Hole Band Clasp — CAD Viewer</title>
<meta name="description" content="Interactive 3D viewer and dimensioned drawing sheets for four adjustable through-hole silicone band clasp concepts.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script type="importmap">
{"imports":{"three":"https://esm.sh/three@0.160.0","three/addons/":"https://esm.sh/three@0.160.0/examples/jsm/"}}
</script>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  @keyframes spin{to{transform:rotate(360deg)}}
  button{font-family:'Archivo',sans-serif}

  /* ===== Mobile responsiveness — the desktop layout (>720px) is left untouched.
     The UI is built with inline styles, so these overrides need !important to win. ===== */
  @media (max-width:720px){
    /* Header: let the meta block wrap below the title and tighten spacing */
    #topbar{flex-wrap:wrap !important;align-items:flex-start !important;gap:14px !important;padding:16px 16px 14px !important}
    #title{font-size:19px !important}
    #meta{width:100% !important;gap:22px !important;text-align:left !important;flex-wrap:wrap !important}

    /* Design switcher: stack the tabs over the tagline; tabs become a 2×2 grid */
    #switcher{flex-direction:column !important;align-items:stretch !important;gap:10px !important;padding:12px 16px !important}
    #tabs{flex-wrap:wrap !important}
    #tabs button{flex:1 1 calc(50% - 3px) !important;padding:11px 10px !important}
    #tagline{max-width:none !important;text-align:left !important}

    /* 3D stage: a little shorter so the toolbar and the content below stay reachable */
    #stage{height:50vh !important;min-height:320px !important}

    /* Controls drop out of the viewport into a full-width bar directly below it */
    #toolbar{position:static !important;transform:none !important;left:auto !important;bottom:auto !important;width:100% !important;max-width:none !important;border:none !important;border-top:1px solid #1c1f26 !important;border-bottom:1px solid #1c1f26 !important;border-radius:0 !important;background:#0c0e12 !important;backdrop-filter:none !important;flex-wrap:wrap !important;justify-content:center !important;gap:6px !important;padding:10px 12px !important}
    #toolbar button{padding:9px 12px !important;font-size:12px !important}
    #toolbar>div{display:none !important}

    /* Pointer-centric affordances that clutter a phone */
    #hint{display:none !important}
    #legend{top:12px !important;right:12px !important;padding:9px 11px !important;font-size:11px !important;gap:7px !important}

    /* Spec strip: 6 columns is unreadable on a phone → 2 columns with row dividers */
    #specStrip{grid-template-columns:repeat(2,1fr) !important}
    #specStrip>div{padding:13px 16px !important;border-bottom:1px solid #16191f !important}
    #specStrip>div:nth-child(2n){border-right:none !important}

    /* Drawing sheet: tighten gutters, stack its header, and drop the tall
       min-height so the width-scaled SVG sits flush instead of on white space */
    #sheetSection{padding:22px 14px 30px !important}
    #sheetSection>div:first-child{flex-direction:column !important;align-items:flex-start !important;gap:4px !important}
    #sheet{min-height:0 !important}
  }

  /* Phones in landscape are wide enough for the desktop layout but very short, so the
     stage's min-height pushes the toolbar off-screen. Reclaim vertical space. Gated on a
     coarse pointer + short viewport so real desktop windows are never affected. */
  @media (orientation:landscape) and (max-height:520px) and (pointer:coarse){
    #stage{min-height:0 !important;height:62vh !important}
    #topbar{padding:12px 24px !important}
    #switcher{padding:9px 24px !important}
  }
</style>
</head>
<body>
<div id="app" style="font-family:'Archivo',system-ui,sans-serif;background:#0a0b0e;color:#e7e9ee;min-height:100%;display:flex;flex-direction:column">

  <header id="topbar" style="display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding:22px 30px 18px;border-bottom:1px solid #1c1f26">
    <div style="display:flex;align-items:center;gap:18px">
      <div style="width:38px;height:38px;border:1.5px solid #3a414e;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9aa3b2" stroke-width="1.6"><rect x="3" y="8" width="18" height="8" rx="2"></rect><line x1="12" y1="4" x2="12" y2="20"></line><circle cx="12" cy="12" r="1.4" fill="#9aa3b2" stroke="none"></circle></svg>
      </div>
      <div>
        <div style="font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#7b8493;font-weight:600"><span id="kicker">Design A</span> · Adjustable Loop Clasp</div>
        <h1 id="title" style="margin:3px 0 0;font-size:23px;font-weight:700;letter-spacing:-.01em">Hex Drop-Pin Buckle</h1>
      </div>
    </div>
    <div id="meta" style="display:flex;gap:26px;text-align:right;font-family:'IBM Plex Mono',monospace">
      <div><div style="font-size:10px;letter-spacing:.12em;color:#6b7280;text-transform:uppercase">Units</div><div style="font-size:15px;font-weight:500;color:#c3c9d4">mm</div></div>
      <div><div style="font-size:10px;letter-spacing:.12em;color:#6b7280;text-transform:uppercase">For</div><div style="font-size:15px;font-weight:500;color:#c3c9d4">Ø20 band</div></div>
      <div><div style="font-size:10px;letter-spacing:.12em;color:#6b7280;text-transform:uppercase">Finish</div><div id="finishName" style="font-size:15px;font-weight:500;color:#c3c9d4">Anodized Aluminum</div></div>
    </div>
  </header>

  <!-- DESIGN SWITCHER -->
  <section id="switcher" style="display:flex;align-items:center;justify-content:space-between;gap:20px;padding:13px 30px;border-bottom:1px solid #1c1f26;background:#0c0e12">
    <div id="tabs" style="display:flex;gap:4px;padding:4px;background:#15181f;border:1px solid #20242e;border-radius:12px">
      <button data-design="0" style="padding:9px 16px;border:none;border-radius:9px;cursor:pointer;font-size:13px;font-weight:600;transition:all .15s"><span style="font-family:'IBM Plex Mono',monospace;opacity:.7;margin-right:7px">A</span>Drop-Pin Buckle</button>
      <button data-design="1" style="padding:9px 16px;border:none;border-radius:9px;cursor:pointer;font-size:13px;font-weight:600;transition:all .15s"><span style="font-family:'IBM Plex Mono',monospace;opacity:.7;margin-right:7px">B</span>Snap Plate</button>
      <button data-design="2" style="padding:9px 16px;border:none;border-radius:9px;cursor:pointer;font-size:13px;font-weight:600;transition:all .15s"><span style="font-family:'IBM Plex Mono',monospace;opacity:.7;margin-right:7px">C</span>Threaded Clamp</button>
      <button data-design="3" style="padding:9px 16px;border:none;border-radius:9px;cursor:pointer;font-size:13px;font-weight:600;transition:all .15s"><span style="font-family:'IBM Plex Mono',monospace;opacity:.7;margin-right:7px">D</span>Press-Stud</button>
    </div>
    <div id="tagline" style="font-size:13px;color:#8a93a2;max-width:540px;text-align:right;line-height:1.4"></div>
  </section>

  <!-- 3D VIEWPORT -->
  <div id="stageWrap" style="position:relative">
  <section id="stage" style="position:relative;height:58vh;min-height:440px;background:radial-gradient(120% 120% at 50% 30%,#1a1e26 0%,#0c0e12 55%,#070809 100%);overflow:hidden">
    <div id="viewport" style="position:absolute;inset:0"></div>

    <div id="loading" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#0a0c10;z-index:5">
      <div style="width:34px;height:34px;border:2.5px solid #232833;border-top-color:#5b8cff;border-radius:50%;animation:spin .9s linear infinite"></div>
      <div style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:#7b8493;letter-spacing:.08em">Compiling geometry…</div>
    </div>

    <!-- legend -->
    <div id="legend" style="position:absolute;top:18px;right:20px;display:flex;flex-direction:column;gap:9px;padding:13px 15px;background:rgba(12,14,18,.66);backdrop-filter:blur(8px);border:1px solid #20242e;border-radius:10px;font-size:12px"></div>

    <div id="hint" style="position:absolute;bottom:20px;left:22px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:#5d6470;letter-spacing:.05em">drag · orbit   scroll · zoom</div>
  </section>

    <!-- Controls: a floating HUD over the viewport on desktop; on mobile (≤720px) this
         drops out of the viewport into a bar directly below it (see the @media block). -->
    <div id="toolbar" style="position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:7px;background:rgba(12,14,18,.72);backdrop-filter:blur(10px);border:1px solid #20242e;border-radius:13px;z-index:6">
      <button id="btnRotate" style="display:flex;align-items:center;gap:7px;padding:9px 14px;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;color:#e7e9ee;transition:background .15s">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.6-6.4"></path><path d="M21 4v5h-5"></path></svg>Rotate</button>
      <button id="btnExplode" style="display:flex;align-items:center;gap:7px;padding:9px 14px;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;color:#e7e9ee;transition:background .15s">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v4M12 17v4M3 12h4M17 12h4"></path><rect x="9.5" y="9.5" width="5" height="5" rx="1"></rect></svg>Explode</button>
      <button id="btnWire" style="display:flex;align-items:center;gap:7px;padding:9px 14px;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;color:#e7e9ee;transition:background .15s">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>Wire</button>
      <button id="btnBand" style="display:flex;align-items:center;gap:7px;padding:9px 14px;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;color:#e7e9ee;transition:background .15s">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="9" width="20" height="6" rx="3"></rect></svg>Band</button>
      <div style="width:1px;background:#262a34;margin:4px 3px"></div>
      <button id="btnFinish" style="display:flex;align-items:center;gap:7px;padding:9px 14px;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;color:#e7e9ee;background:rgba(255,255,255,.06)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"></circle><path d="M12 3a9 9 0 0 0 0 18"></path></svg>Finish</button>
      <button id="btnReset" style="display:flex;align-items:center;gap:7px;padding:9px 14px;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;color:#e7e9ee;background:rgba(255,255,255,.06)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 1 9 9"></path><path d="M3 12V7M3 12h5"></path></svg>Reset</button>
    </div>
  </div>

  <!-- SPEC STRIP -->
  <section id="specStrip" style="display:grid;grid-template-columns:repeat(6,1fr);border-bottom:1px solid #1c1f26;background:#0c0e12"></section>

  <!-- DRAWING SHEET -->
  <section id="sheetSection" style="padding:34px 30px 46px;background:#0a0b0e">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;max-width:1080px;margin-left:auto;margin-right:auto;width:100%">
      <div id="sheetTitle" style="font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#7b8493;font-weight:600">Dimensioned Drawing</div>
      <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#6b7280">Third-angle · all dims in mm</div>
    </div>
    <div style="max-width:1080px;margin:0 auto;border-radius:6px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5)">
      <div id="sheet" style="min-height:600px;background:#f4f5f3"></div>
    </div>
  </section>

</div>

<script type="module">
const $ = (id) => document.getElementById(id);

class ClaspViewer {
  constructor(){
    this.vp = $('viewport');
    this.loadEl = $('loading');
    this.sheetEl = $('sheet');

    const FIN = ['Brushed Steel','Black Oxide','Anodized Aluminum','Antique Bronze'];
    this.FIN = FIN;
    this.PITCH = 16.6; this.LOBE = 10;
    this.DESIGNS = [
      { kicker:'Design A', title:'Hex Drop-Pin Buckle',
        tagline:'Captive knurled pin drops through the doubled band; hex flats lock rotation. Classic and serviceable.',
        legend:[['m','Stainless buckle frame'],['p','Captive hex drop-pin'],['b','Silicone band · ×2 layers']],
        specs:[{k:'Mechanism',v:'Drop-pin',u:''},{k:'Pin hex',v:'5',u:'A/F'},{k:'Holes',v:'1',u:'×2 lyr'},{k:'Body',v:'29×16',u:'mm'},{k:'Adjust step',v:'16.6',u:'mm'},{k:'Tol',v:'±0.1',u:'mm'}] },
      { kicker:'Design B', title:'Twin-Prong Snap Plate',
        tagline:'Slim plate with two hex prongs that snap through two holes into a catch plate. Squeeze the tabs to release.',
        legend:[['m','Snap plate + catch'],['p','Twin hex prongs'],['b','Silicone band · ×2 layers']],
        specs:[{k:'Mechanism',v:'Snap prong',u:''},{k:'Prong hex',v:'5',u:'A/F'},{k:'Holes',v:'2',u:'×2 lyr'},{k:'Plate',v:'36×26',u:'mm'},{k:'Height',v:'10',u:'mm'},{k:'Release',v:'Squeeze',u:''}] },
      { kicker:'Design C', title:'Threaded Hex Clamp',
        tagline:'Hex stud passes the holes; a knurled cap screws down and clamps the layers solid. Heavy-duty, infinitely re-settable.',
        legend:[['m','Base + knurled cap'],['p','Hex clamp stud'],['b','Silicone band · ×2 layers']],
        specs:[{k:'Mechanism',v:'Screw clamp',u:''},{k:'Stud hex',v:'5',u:'A/F'},{k:'Holes',v:'1',u:'×2 lyr'},{k:'Cap',v:'Ø16',u:'mm'},{k:'Clamp',v:'Threaded',u:''},{k:'Adjust step',v:'16.6',u:'mm'}] },
      { kicker:'Design D', title:'One-Piece Press-Stud',
        tagline:'A single solid hex stud with a mushroom head — the silicone deforms over the head and snaps captive around the post. No moving parts.',
        legend:[['m','One-piece hex press-stud'],['b','Silicone band · ×2 layers']],
        specs:[{k:'Mechanism',v:'Press-stud',u:''},{k:'Post hex',v:'5',u:'A/F'},{k:'Holes',v:'1',u:'×2 lyr'},{k:'Head',v:'Ø8.5',u:'mm'},{k:'Parts',v:'1',u:'solid'},{k:'Install',v:'Press-fit',u:''}] },
    ];
    // Standalone defaults (mirror the prototype's no-prop render):
    // finish → Anodized Aluminum, auto-rotate on, band shown, not exploded.
    this.st = {
      design: 0,
      finishIdx: 2,
      autoRotate: true,
      exploded: false,
      wire: false,
      showBand: true,
    };
    this._explodeVal = this.st.exploded ? 1 : 0;
    this._explodeTarget = this._explodeVal;
    this._sheet = this._buildSheet(this.st.design);
  }

  finishName(){ return this.FIN[this.st.finishIdx]; }
  finishPreset(i){
    return [
      {color:0xc4c8ce, metalness:1.0,  roughness:0.34, env:1.05, pin:0x9aa3b4, pinR:0.30},
      {color:0x33363c, metalness:0.92, roughness:0.52, env:0.70, pin:0x4a4e55, pinR:0.42},
      {color:0xd9dce0, metalness:1.0,  roughness:0.26, env:1.15, pin:0xc6cace, pinR:0.24},
      {color:0x82632f, metalness:1.0,  roughness:0.50, env:0.92, pin:0xbb8e4d, pinR:0.40},
    ][i];
  }

  async mount(){
    // Render the UI + dimensioned drawing sheet first — these are pure DOM/SVG and
    // must not depend on the 3D engine loading (so the sheet survives a slow/blocked CDN).
    this._wireUI();
    this._renderUI();
    this._renderSheet();
    try{
      // Three.js is loaded dynamically (over the network) so a failure here only
      // disables the 3D viewport, leaving the rest of the page intact.
      const THREE = await import('three');
      const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');
      const { RoomEnvironment } = await import('three/addons/environments/RoomEnvironment.js');
      this.THREE = THREE; this.OrbitControls = OrbitControls; this.RoomEnvironment = RoomEnvironment;
      this._build();
      if(this.loadEl) this.loadEl.style.display='none';
    }catch(e){
      console.error('clasp build failed', e);
      if(this.loadEl){
        this.loadEl.innerHTML = '<div style="font-family:monospace;color:#e06b6b;font-size:13px;max-width:360px;text-align:center;line-height:1.5">3D engine failed to load.<br>'+ (e&&e.message?e.message:'') +'</div>';
      }
    }
  }

  // ===== geometry helpers =====
  _reg(m){ m.castShadow=true; m.receiveShadow=true; return m; }
  _RB(w,h,d){ const T=this.THREE; return T.RoundedBoxGeometry ? new T.RoundedBoxGeometry(w,h,d,4,Math.min(w,h,d)*0.16) : new T.BoxGeometry(w,h,d); }
  _centersIn(xs,xe){ const P=this.PITCH,r=[]; for(let i=Math.ceil(xs/P);i<=Math.floor(xe/P);i++) r.push(i*P); if(!r.length) r.push(0); return r; }

  // one band layer: scalloped lobe-chain slab with real hex through-holes + socket bosses
  _bandSlab(xs,xe,roundStart,roundEnd,bossDir){
    const T=this.THREE, R=this.LOBE, P=this.PITCH;
    const centers=this._centersIn(xs,xe);
    const firstC=centers[0], lastC=centers[centers.length-1];
    const half=(x)=>{ let c; if(x<firstC)c=firstC; else if(x>lastC)c=lastC; else c=Math.round(x/P)*P; const dx=x-c,v=R*R-dx*dx; return v>0?Math.sqrt(v):0.0; };
    const xA=roundStart?firstC-R+0.03:firstC, xB=roundEnd?lastC+R-0.03:lastC, st=0.5;
    const shape=new T.Shape();
    shape.moveTo(xA, half(xA));
    for(let x=xA+st;x<xB;x+=st) shape.lineTo(x, half(x));
    shape.lineTo(xB, half(xB)); shape.lineTo(xB, -half(xB));
    for(let x=xB-st;x>xA;x-=st) shape.lineTo(x, -half(x));
    shape.lineTo(xA,-half(xA)); shape.closePath();
    const Rh=5/Math.sqrt(3);
    for(const c of centers){ const h=new T.Path(); for(let k=0;k<6;k++){ const a=Math.PI/180*(60*k+30), px=c+Rh*Math.cos(a), py=Rh*Math.sin(a); k?h.lineTo(px,py):h.moveTo(px,py);} h.closePath(); shape.holes.push(h); }
    const geo=new T.ExtrudeGeometry(shape,{depth:4,bevelEnabled:true,bevelThickness:0.6,bevelSize:0.6,bevelSegments:2,steps:1,curveSegments:5});
    geo.translate(0,0,-2);
    const slab=this._reg(new T.Mesh(geo,this.bandMat)); slab.rotation.x=-Math.PI/2;
    const g=new T.Group(); g.add(slab);
    for(const c of centers){
      const bs=new T.Shape(); bs.absarc(0,0,6.55,0,Math.PI*2,false); const bh=new T.Path(); bh.absarc(0,0,3.5,0,Math.PI*2,true); bs.holes.push(bh);
      const bg=new T.ExtrudeGeometry(bs,{depth:0.8,bevelEnabled:true,bevelThickness:0.25,bevelSize:0.25,bevelSegments:1,steps:1,curveSegments:26});
      const bm=this._reg(new T.Mesh(bg,this.bandMat));
      if(bossDir>0){ bm.rotation.x=-Math.PI/2; bm.position.set(c,2,0); } else { bm.rotation.x=Math.PI/2; bm.position.set(c,-2,0); }
      g.add(bm);
    }
    return {group:g, centers};
  }

  // ===== frame helpers with real through-holes =====
  _roundRect(w,d,r){
    const T=this.THREE,s=new T.Shape(),hw=w/2,hd=d/2;
    s.moveTo(-hw+r,-hd);
    s.lineTo(hw-r,-hd); s.absarc(hw-r,-hd+r,r,-Math.PI/2,0,false);
    s.lineTo(hw,hd-r); s.absarc(hw-r,hd-r,r,0,Math.PI/2,false);
    s.lineTo(-hw+r,hd); s.absarc(-hw+r,hd-r,r,Math.PI/2,Math.PI,false);
    s.lineTo(-hw,-hd+r); s.absarc(-hw+r,-hd+r,r,Math.PI,Math.PI*1.5,false);
    s.closePath(); return s;
  }
  _holeBar(wX,dZ,hY,holeR){
    const T=this.THREE;
    const s=this._roundRect(wX,dZ,Math.min(wX,dZ)*0.14);
    const h=new T.Path(); h.absarc(0,0,holeR,0,Math.PI*2,true); s.holes.push(h);
    const geo=new T.ExtrudeGeometry(s,{depth:hY,bevelEnabled:true,bevelThickness:0.5,bevelSize:0.5,bevelSegments:2,steps:1,curveSegments:10});
    geo.translate(0,0,-hY/2);
    const m=this._reg(new T.Mesh(geo,this.metal)); m.rotation.x=-Math.PI/2; return m;
  }
  _ring(outR,inR,hY){
    const T=this.THREE,s=new T.Shape(); s.absarc(0,0,outR,0,Math.PI*2,false); const h=new T.Path(); h.absarc(0,0,inR,0,Math.PI*2,true); s.holes.push(h);
    const geo=new T.ExtrudeGeometry(s,{depth:hY,bevelEnabled:true,bevelThickness:0.2,bevelSize:0.2,bevelSegments:1,steps:1,curveSegments:34});
    geo.translate(0,0,-hY/2);
    return this._reg(new T.Mesh(geo,this.metal));
  }
  _holePlateMulti(wX,dZ,hY,holes){
    const T=this.THREE;
    const s=this._roundRect(wX,dZ,Math.min(wX,dZ)*0.14);
    for(const h of holes){ const p=new T.Path(); p.absarc(h.x||0,0,h.r,0,Math.PI*2,true); s.holes.push(p); }
    const geo=new T.ExtrudeGeometry(s,{depth:hY,bevelEnabled:true,bevelThickness:0.5,bevelSize:0.5,bevelSegments:2,steps:1,curveSegments:10});
    geo.translate(0,0,-hY/2);

  // ===== clasp builders (return {group, explode}) =====
  _claspA(){
    const T=this.THREE, M=this.metal, P=this.pinMat, g=new T.Group();

    const botBar=this._holeBar(15,29,3.4,3.0); botBar.position.y=-6;
    const postP=this._reg(new T.Mesh(this._RB(15,15,3.4),M)); postP.position.z=12.8;
    const postN=this._reg(new T.Mesh(this._RB(15,15,3.4),M)); postN.position.z=-12.8;

    const bossB=this._ring(4.2,3.0,1.4); bossB.rotation.x=Math.PI/2; bossB.position.y=-8.35;

  _claspB(){
    const T=this.THREE, M=this.metal, P=this.pinMat, g=new T.Group(); g.position.x=8.3;
    const top=new T.Group();
    const plate=this._holePlateMulti(36,26,3.6,[]); plate.position.y=5; top.add(plate);
    const tabP=this._holePlateMulti(9,5,3.2,[]); tabP.position.set(0,5,14.6); top.add(tabP);
    const tabN=this._holePlateMulti(9,5,3.2,[]); tabN.position.set(0,5,-14.6); top.add(tabN);

  _claspC(){

  _claspD(){
    const T=this.THREE, M=this.metal, g=new T.Group();
    const stud=new T.Group();
    const flange=this._reg(new T.Mesh(new T.CylinderGeometry(6.5,7.0,2.6,44),M)); flange.position.y=-5.3;
    const Rp=5/Math.sqrt(3);

  _build(){
    const THREE=this.THREE, OrbitControls=this.OrbitControls, RoomEnvironment=this.RoomEnvironment;
    const host=this.vp, W=host.clientWidth||800, H=host.clientHeight||480;
    const scene=new THREE.Scene(); this.scene=scene;
    const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
    renderer.setSize(W,H); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
    renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05;
    renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
    host.appendChild(renderer.domElement); this.renderer=renderer;
    const pmrem=new THREE.PMREMGenerator(renderer); scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
    const camera=new THREE.PerspectiveCamera(34,W/H,0.1,3000); camera.position.set(40,30,58); this.camera=camera;
    const controls=new OrbitControls(camera,renderer.domElement); controls.enableDamping=true; controls.dampingFactor=0.08; controls.minDistance=24; controls.maxDistance=260; controls.autoRotate=this.st.autoRotate; controls.autoRotateSpeed=1.1; this.controls=controls;
    const key=new THREE.DirectionalLight(0xffffff,1.45); key.position.set(34,58,26); key.castShadow=true; key.shadow.mapSize.set(2048,2048);
    const d=60; Object.assign(key.shadow.camera,{left:-d,right:d,top:d,bottom:-d,near:1,far:240}); key.shadow.bias=-0.0004; key.shadow.normalBias=0.6; scene.add(key);
    const fill=new THREE.DirectionalLight(0x88a0ff,0.35); fill.position.set(-40,20,-30); scene.add(fill);
    const rim=new THREE.DirectionalLight(0xffffff,0.5); rim.position.set(0,10,-50); scene.add(rim);
    scene.add(new THREE.AmbientLight(0xffffff,0.16));
    const ground=new THREE.Mesh(new THREE.PlaneGeometry(500,500), new THREE.ShadowMaterial({opacity:0.3})); ground.rotation.x=-Math.PI/2; ground.position.y=-9.8; ground.receiveShadow=true; scene.add(ground);
    const root=new THREE.Group(); scene.add(root); this.root=root;
    const fp=this.finishPreset(this.st.finishIdx);
    this.metal=new THREE.MeshStandardMaterial({color:fp.color,metalness:fp.metalness,roughness:fp.roughness,envMapIntensity:fp.env});
    this.pinMat=new THREE.MeshStandardMaterial({color:fp.pin,metalness:1.0,roughness:fp.pinR,envMapIntensity:1.08});
    this.bandMat=new THREE.MeshPhysicalMaterial({color:0x161719,metalness:0,roughness:0.97,clearcoat:0.16,clearcoatRoughness:0.72,envMapIntensity:0.45,side:THREE.DoubleSide});

  }

  _assemble(design){
    if(!this.THREE) return;
    const T=this.THREE;
    if(this.partsGroup){ this.partsGroup.traverse(o=>{ if(o.geometry) o.geometry.dispose(); }); this.root.remove(this.partsGroup); }
    const pg=new T.Group(); this.root.add(pg); this.partsGroup=pg;
    // shared band: standing layer (long, flat ends) + tail (rounded finished end)
    const top=this._bandSlab(-58,58,false,false,1); top.group.position.y=2;
    const bot=this._bandSlab(-58,26,false,true,-1); bot.group.position.y=-2;
    const bandG=new T.Group(); bandG.add(top.group,bot.group); bandG.visible=this.st.showBand; pg.add(bandG);
    this.bandGroup=bandG; this._bandTop=top.group; this._bandBot=bot.group;
    // clasp
    const clasp=[this._claspA,this._claspB,this._claspC,this._claspD][design].call(this); pg.add(clasp.group);
    this._explodeClasp=clasp.explode; this._claspGroup=clasp.group; this._curDesign=design; this._bandExplodeAmt = (design===0||design===3) ? 0 : 4;
    this._allMeshMats.forEach(m=>m.wireframe=this.st.wire);
    this._sheet=this._buildSheet(design);
    this._renderSheet();
    this._frame(clasp.group);
    this._paint();
  }
  _paint(){ if(this.renderer&&this.scene&&this.camera) this.renderer.render(this.scene,this.camera); }
  _renderSheet(){ if(this.sheetEl) this.sheetEl.innerHTML = this._sheet || ''; }
  _applyBand(e){ const a=(this._bandExplodeAmt==null?4:this._bandExplodeAmt); if(this._bandTop){ this._bandTop.position.y=2+a*e; this._bandBot.position.y=-2-a*e; } }

  _animate=()=>{
    this._raf=requestAnimationFrame(this._animate);
    this._explodeVal += (this._explodeTarget-this._explodeVal)*0.12;
    const e=this._explodeVal;
    if(this._explodeClasp) this._explodeClasp(e);
    this._applyBand(e);
    if(this.controls) this.controls.update();
    if(this.renderer) this.renderer.render(this.scene,this.camera);
  }

  _frame(obj){
    const T=this.THREE; const box=new T.Box3().setFromObject(obj); const sph=box.getBoundingSphere(new T.Sphere());
    const c=sph.center.clone(), r=sph.radius;
    const fit = this._curDesign===3 ? 1.7 : 1.35;
    const dist=r/Math.sin((this.camera.fov*Math.PI/180)/2)*fit;
    const dir=new T.Vector3(0.46,0.42,0.78).normalize();
    this.camera.position.copy(c).add(dir.multiplyScalar(dist));
    this.controls.target.copy(c); this.controls.update();
    this._home=this.camera.position.clone(); this._homeT=c.clone();
  }

  _resize(){ const host=this.vp; if(!host||!this.renderer)return; const W=host.clientWidth,H=host.clientHeight; this.camera.aspect=W/H; this.camera.updateProjectionMatrix(); this.renderer.setSize(W,H); }
  _setFinish(i){ const fp=this.finishPreset(i); if(this.metal){ this.metal.color.setHex(fp.color); this.metal.metalness=fp.metalness; this.metal.roughness=fp.roughness; this.metal.envMapIntensity=fp.env; } if(this.pinMat){ this.pinMat.color.setHex(fp.pin); this.pinMat.roughness=fp.pinR; } this.st.finishIdx=i; this._paint(); this._renderUI(); }

  switchDesign(i){ if(i===this.st.design) return; this.st.design=i; this._sheet=this._buildSheet(i); this._renderSheet(); this._assemble(i); this._renderUI(); }
  toggleRotate(){ const v=!this.st.autoRotate; this.st.autoRotate=v; if(this.controls) this.controls.autoRotate=v; this._renderUI(); this._paint(); }
  toggleExplode(){ const v=!this.st.exploded; this.st.exploded=v; this._explodeTarget=v?1:0; this._renderUI(); this._kick(); }
  toggleWire(){ const v=!this.st.wire; this.st.wire=v; if(this._allMeshMats) this._allMeshMats.forEach(m=>m.wireframe=v); this._renderUI(); this._paint(); }
  toggleBand(){ const v=!this.st.showBand; this.st.showBand=v; if(this.bandGroup) this.bandGroup.visible=v; this._renderUI(); this._paint(); }

  // ================= UI WIRING =================

      (()=>{ const s=8.6, cx=820, cy=210; const X=mm=>cx+mm*s, Y=mm=>cy-mm*s;

        A.push('<line x1="'+X(1.4)+'" y1="'+Y(8.7)+'" x2="'+X(1.4)+'" y2="'+Y(-7.3)+'" stroke="'+NB+'" stroke-width="0.4" opacity="0.4"/>');

        A.push(cl(X(0),Y(16),X(0),Y(-11)));
        A.push(hDim(X(-5.2),X(5.2),Y(13.5)+26,Y(15.2),'Ø10',true));

    } else if(design===1){
      // B — ASSEMBLY SECTION
      (()=>{ const s=4.7, cx=250, cy=205; const Z=mm=>cx+mm*s, Y=mm=>cy-mm*s, X2=mm=>cx+mm*s;
        A.push(lab(60,52,'ASSEMBLY — SECTION'));

        A.push('<rect x="'+Z(-18)+'" y="'+Y(6.8)+'" width="'+(36*s)+'" height="'+(3.6*s)+'" rx="2.4" fill="'+STL+'" stroke="'+NB+'" stroke-width="1.2"/>');
        // catch plate with two through-holes
        A.push('<rect x="'+Z(-18)+'" y="'+Y(-4.7)+'" width="'+(36*s)+'" height="'+(3.2*s)+'" rx="2.4" fill="'+STL+'" stroke="'+NB+'" stroke-width="1.2"/>');
        for(const px of [-8.3,8.3]) A.push('<rect x="'+Z(px-2.5)+'" y="'+Y(-4.7)+'" width="'+(5*s)+'" height="'+(3.2*s)+'" fill="'+PAPER+'" stroke="'+NB+'" stroke-width="0.7"/>');
        A.push(lyr(Z,Y,BANDC));
        // two prongs at ±8.3 passing fully through into the catch plate
        for(const px of [-8.3,8.3]){ A.push('<rect x="'+Z(px-2.5)+'" y="'+Y(6.8)+'" width="'+(5*s)+'" height="'+(14*s)+'" fill="#cfd6de" stroke="'+NB+'" stroke-width="0.9"/>'); A.push('<path d="M'+Z(px-2.9)+' '+Y(-6.8)+' L'+Z(px+2.9)+' '+Y(-6.8)+' L'+Z(px+1.6)+' '+Y(-8.2)+' L'+Z(px-1.6)+' '+Y(-8.2)+' Z" fill="#cfd6de" stroke="'+NB+'" stroke-width="0.8"/>'); A.push(cl(Z(px),Y(9),Z(px),Y(-9))); }
        A.push(txt(Z(18)+4,Y(-6.6)+4,'Ø6 THRU ×2',{a:'start',fs:10.5}));
        A.push(hDim(Z(-18),Z(18),Y(-6.4)+28,Y(-6.4),'36',true));
        A.push(hDim(Z(-8.3),Z(8.3),Y(8.4)+0,Y(8.4),'16.6'));

        A.push(vDim(Y(4),Y(-4),Z(-18)-18,Z(-10),'8',true));
      })();
      // B — PLATE PLAN + prong
      (()=>{ const s=4.7, cx=820, cy=170; const X=mm=>cx+mm*s, Z=mm=>cy+mm*s;
        A.push(lab(600,52,'SNAP PLATE — PLAN'));
        A.push('<rect x="'+X(-18)+'" y="'+Z(-13)+'" width="'+(36*s)+'" height="'+(26*s)+'" rx="6" fill="'+STL+'" stroke="'+NB+'" stroke-width="1.3"/>');
        for(const px of [-8.3,8.3]){ A.push('<path d="'+hex(X(px),Z(0),5*s,0)+'" fill="#cfd6de" stroke="'+NB+'" stroke-width="1"/>'); A.push(cl(X(px),Z(-15),X(px),Z(15))); }
        A.push('<rect x="'+X(-4.5)+'" y="'+Z(-15.6)+'" width="'+(9*s)+'" height="'+(2.6*s)+'" rx="1" fill="'+STL+'" stroke="'+NB+'" stroke-width="0.9"/>');

    } else if(design===2){
      // C — ASSEMBLY SECTION
      (()=>{ const s=5.2, cx=250, cy=210; const Z=mm=>cx+mm*s, Y=mm=>cy-mm*s;
        A.push(lab(60,52,'ASSEMBLY — SECTION'));
        // base disc
        A.push('<rect x="'+Z(-11)+'" y="'+Y(-4.5)+'" width="'+(22*s)+'" height="'+(3*s)+'" rx="2" fill="'+STL+'" stroke="'+NB+'" stroke-width="1.2"/>');
        A.push(lyr(Z,Y,BANDC));
        // stud
        A.push('<rect x="'+Z(-2.5)+'" y="'+Y(4)+'" width="'+(5*s)+'" height="'+(8.5*s)+'" fill="#cfd6de" stroke="'+NB+'" stroke-width="0.9"/>');

        A.push('<rect x="'+Z(-8)+'" y="'+Y(10)+'" width="'+(16*s)+'" height="'+(6.2*s)+'" rx="1.5" fill="#cfd6de" stroke="'+NB+'" stroke-width="1.1"/>');
        for(let i=-7;i<=7;i++) A.push('<line x1="'+Z(i*1.05)+'" y1="'+Y(10)+'" x2="'+Z(i*1.05)+'" y2="'+Y(16.2)+'" stroke="'+NB+'" stroke-width="0.35" opacity="0.45"/>');
        A.push(cl(Z(0),Y(18),Z(0),Y(-7)));
        A.push(hDim(Z(-11),Z(11),Y(-6)+24,Y(-6),'Ø22',true));
        A.push(hDim(Z(-8),Z(8),Y(16.2)+12,Y(16.2),'Ø16',true));
        A.push(vDim(Y(16.2),Y(-6),Z(11)+34,Z(8),'26'));
        A.push(vDim(Y(4),Y(-4),Z(-11)-18,Z(-10),'8',true));
      })();
      // C — CAP + STUD DETAIL
      (()=>{ const s=7.4, cx=820, cy=215; const X=mm=>cx+mm*s, Y=mm=>cy-mm*s;
        A.push(lab(600,52,'CAP & STUD')); A.push(sub(600,70,'SCALE 1.5:1'));
        A.push('<rect x="'+X(-8)+'" y="'+Y(13)+'" width="'+(16*s)+'" height="'+(6.2*s)+'" rx="2" fill="#dfe4ea" stroke="'+NB+'" stroke-width="1.2"/>');
        for(let i=-7;i<=7;i++) A.push('<line x1="'+X(i*1.05)+'" y1="'+Y(13)+'" x2="'+X(i*1.05)+'" y2="'+Y(6.8)+'" stroke="'+NB+'" stroke-width="0.35" opacity="0.5"/>');
        A.push('<rect x="'+X(-2.5)+'" y="'+Y(6.8)+'" width="'+(5*s)+'" height="'+(11*s)+'" fill="'+STL+'" stroke="'+NB+'" stroke-width="1.1"/>');
        for(let i=0;i<6;i++){ const yy=Y(6.0-i*0.95); A.push('<line x1="'+X(-2.5)+'" y1="'+yy+'" x2="'+X(2.5)+'" y2="'+(yy+5)+'" stroke="'+NB+'" stroke-width="0.5" opacity="0.5"/>'); }
        A.push('<path d="'+hex(X(0),Y(-1.5),3*s,0)+'" fill="none" stroke="'+NB+'" stroke-width="0.5" stroke-dasharray="3 2" opacity="0.6"/>');
        A.push('<line x1="'+X(2.5)+'" y1="'+Y(3)+'" x2="'+X(8)+'" y2="'+Y(3)+'" stroke="'+DL+'" stroke-width="0.5"/>');
        A.push(txt(X(8)+3,Y(3)+4,'M5 thread',{a:'start',fs:11}));
        A.push(cl(X(0),Y(17),X(0),Y(-5)));
        A.push(hDim(X(-8),X(8),Y(13)+22,Y(13),'Ø16',true));
        A.push(hDim(X(-2.5),X(2.5),Y(-4.2)-12,Y(-4.2),'5 A/F'));
        A.push(vDim(Y(13),Y(6.8),X(8)+20,X(8),'6'));
        A.push(txt(X(8)+14,Y(10)+4,'knurled cap',{a:'start',fs:11}));
      })();
    } else {
      // D — ASSEMBLY SECTION
      (()=>{ const s=5.4, cx=250, cy=210; const Z=mm=>cx+mm*s, Y=mm=>cy-mm*s;
        A.push(lab(60,52,'ASSEMBLY — SECTION'));
        A.push('<rect x="'+Z(-6.5)+'" y="'+Y(-4)+'" width="'+(13*s)+'" height="'+(2.6*s)+'" rx="1.4" fill="'+STL+'" stroke="'+NB+'" stroke-width="1.2"/>');

        A.push('<rect x="'+Z(-2.5)+'" y="'+Y(4)+'" width="'+(5*s)+'" height="'+(8*s)+'" fill="'+STL+'" stroke="'+NB+'" stroke-width="1.1"/>');
        A.push('<path d="M'+Z(-2.5)+' '+Y(4)+' L'+Z(-4.3)+' '+Y(5.6)+' Q'+Z(0)+' '+Y(9.4)+' '+Z(4.3)+' '+Y(5.6)+' L'+Z(2.5)+' '+Y(4)+' Z" fill="'+STL+'" stroke="'+NB+'" stroke-width="1.2"/>');
        A.push(cl(Z(0),Y(10),Z(0),Y(-6.6)));
        A.push(hDim(Z(-6.5),Z(6.5),Y(-4)+26,Y(-4),'Ø13',true));

        A.push(txt(Z(8)+12,Y(-1.4),'press-fit',{a:'start',fs:10.5,fill:GRY}));
      })();
      // D — STUD DETAIL
      (()=>{ const s=8.4, cx=820, cy=220; const X=mm=>cx+mm*s, Y=mm=>cy-mm*s;
        A.push(lab(600,52,'PRESS-STUD — ONE PIECE')); A.push(sub(600,70,'SCALE 2:1'));
        A.push('<rect x="'+X(-6.5)+'" y="'+Y(-4)+'" width="'+(13*s)+'" height="'+(2.6*s)+'" rx="1.4" fill="#dfe4ea" stroke="'+NB+'" stroke-width="1.2"/>');
        A.push('<rect x="'+X(-2.5)+'" y="'+Y(4)+'" width="'+(5*s)+'" height="'+(8*s)+'" fill="'+STL+'" stroke="'+NB+'" stroke-width="1.1"/>');
        A.push('<line x1="'+X(-1.4)+'" y1="'+Y(4)+'" x2="'+X(-1.4)+'" y2="'+Y(-4)+'" stroke="'+NB+'" stroke-width="0.4" opacity="0.4"/>');
        A.push('<line x1="'+X(1.4)+'" y1="'+Y(4)+'" x2="'+X(1.4)+'" y2="'+Y(-4)+'" stroke="'+NB+'" stroke-width="0.4" opacity="0.4"/>');
        A.push('<path d="M'+X(-2.5)+' '+Y(4)+' L'+X(-4.3)+' '+Y(5.6)+' Q'+X(0)+' '+Y(9.8)+' '+X(4.3)+' '+Y(5.6)+' L'+X(2.5)+' '+Y(4)+' Z" fill="#dfe4ea" stroke="'+NB+'" stroke-width="1.2"/>');
        A.push(cl(X(0),Y(11),X(0),Y(-6)));
        A.push(hDim(X(-4.3),X(4.3),Y(9.8)+8,Y(8.8),'Ø8.5'));

        A.push(vDim(Y(8.6),Y(-6.6),X(6.5)+22,X(6.5),'15'));

      })();
    }

    // ---------- SHARED: BAND DETAIL (the dimensioned part) ----------
    (()=>{ const s=6.4, cx=410, cyc=505; const X=mm=>cx+mm*s, Z=mm=>cyc+mm*s, P=this.PITCH, R=this.LOBE;
      A.push(lab(60,418,'SILICONE BAND — bead chain, true hex through-holes'));
      A.push(sub(60,436,'Ø20 lobes · pitch 16.6 · ×17 over 224 length'));
      const half=(x)=>{ const c=Math.round(x/P)*P, dx=x-c, v=R*R-dx*dx; return v>0?Math.sqrt(v):0; };
      const cs=[-2*P,-P,0,P,2*P]; const x0=cs[0]-R, x1=cs[cs.length-1]+R;
      let d='M '+X(x0).toFixed(1)+' '+Z(-half(x0)).toFixed(1);
      for(let x=x0;x<=x1;x+=0.6) d+=' L '+X(x).toFixed(1)+' '+Z(-half(x)).toFixed(1);
      for(let x=x1;x>=x0;x-=0.6) d+=' L '+X(x).toFixed(1)+' '+Z(half(x)).toFixed(1);
      d+=' Z';
      A.push('<path d="'+d+'" fill="'+BANDC+'" opacity="0.14" stroke="'+BANDC+'" stroke-width="1.1"/>');
      for(const c of cs){ A.push('<circle cx="'+X(c)+'" cy="'+Z(0)+'" r="'+(6.55*s)+'" fill="none" stroke="'+NB+'" stroke-width="0.7" opacity="0.65"/>'); A.push('<circle cx="'+X(c)+'" cy="'+Z(0)+'" r="'+(3.5*s)+'" fill="#fff" stroke="'+NB+'" stroke-width="0.8"/>'); A.push('<path d="'+hex(X(c),Z(0),5*s,0)+'" fill="'+STL+'" stroke="'+NB+'" stroke-width="1"/>'); A.push(cl(X(c),Z(-12),X(c),Z(12))); }
      A.push(cl(X(x0-2),Z(0),X(x1+2),Z(0)));
      A.push(hDim(X(0),X(P),Z(-10.6),Z(-half(0)),'16.6'));
      A.push(vDim(Z(-10),Z(10),X(0)-6.55*s-16,X(0),'Ø20',true));
      A.push(vDim(Z(-half(P/2)),Z(half(P/2)),X(P/2)+12,X(P/2),'11.1'));
      A.push(hDim(X(2*P-6.55),X(2*P+6.55),Z(10.6)+14,Z(8),'13.1',true));
      // SECTION (thickness) at right
      (()=>{ const s2=7.4, zx=720, zy=470; const ZZ=mm=>zx+mm*s2, YY=mm=>zy-mm*s2;
        A.push(sub(zx-44,zy-7.2*s2-14,'SECTION'));
        A.push('<rect x="'+ZZ(-10)+'" y="'+YY(2)+'" width="'+(20*s2)+'" height="'+(4*s2)+'" rx="1.4" fill="'+BANDC+'" opacity="0.16" stroke="'+BANDC+'" stroke-width="1"/>');
        // socket counterbore reduces to 2mm rim
        A.push('<rect x="'+ZZ(-3.5)+'" y="'+YY(2)+'" width="'+(7*s2)+'" height="'+(1*s2)+'" fill="'+PAPER+'" stroke="'+NB+'" stroke-width="0.8"/>');
        A.push('<rect x="'+ZZ(-2.5)+'" y="'+YY(2)+'" width="'+(5*s2)+'" height="'+(4*s2)+'" fill="'+PAPER+'" stroke="'+NB+'" stroke-width="0.9"/>');
        A.push(cl(ZZ(0),YY(4.5),ZZ(0),YY(-4)));
        A.push(vDim(YY(2),YY(-2),ZZ(10)+18,ZZ(10),'4'));
        A.push(vDim(YY(1),YY(-2),ZZ(-10)-16,ZZ(-3.5),'2',true));
        A.push(hDim(ZZ(-10),ZZ(10),YY(-2)+30,YY(-2),'20',true));
        A.push(hDim(ZZ(-3.5),ZZ(3.5),YY(2)-14,YY(2),'Ø7'));
      })();
      // HOLE DETAIL (3:1) far right
      (()=>{ const s3=11, hx=945, hy=485;
        A.push(sub(hx-40,hy-7.2*11-14,'HOLE 3:1'));
        A.push('<circle cx="'+hx+'" cy="'+hy+'" r="'+(6.55*s3)+'" fill="none" stroke="'+NB+'" stroke-width="1.1"/>');
        A.push('<circle cx="'+hx+'" cy="'+hy+'" r="'+(3.5*s3)+'" fill="#fff" stroke="'+NB+'" stroke-width="1"/>');
        A.push('<path d="'+hex(hx,hy,5*s3,0)+'" fill="'+STL+'" stroke="'+NB+'" stroke-width="1.2"/>');
        A.push(txt(hx,hy+2,'5',{fs:12,w:600}));
        A.push('<line x1="'+hx+'" y1="'+hy+'" x2="'+(hx+6.55*s3*0.7)+'" y2="'+(hy-6.55*s3*0.7)+'" stroke="'+DL+'" stroke-width="0.6"/>');
        A.push(txt(hx+6.55*s3*0.7+4,hy-6.55*s3*0.7-2,'Ø13.1',{a:'start',fs:11}));
      })();
    })();

    // ---------- TITLE BLOCK ----------
    (()=>{ const D=this.DESIGNS[design]; const x=16,y=H-104,w=W-32,h=88;
      A.push('<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="#eceef0" stroke="'+NB+'" stroke-width="1"/>');
      const cols=[0,300,470,640,810,w];
      for(let i=1;i<cols.length-1;i++) A.push('<line x1="'+(x+cols[i])+'" y1="'+y+'" x2="'+(x+cols[i])+'" y2="'+(y+h)+'" stroke="'+NB+'" stroke-width="0.6"/>');
      A.push('<line x1="'+x+'" y1="'+(y+44)+'" x2="'+(x+cols[1])+'" y2="'+(y+44)+'" stroke="'+NB+'" stroke-width="0.6"/>');
      const cell=(cx,cy,k,v,big)=>{A.push(txt(cx,cy,k,{fill:GRY,fs:9.5,a:'start',ls:'0.12em'}));A.push(txt(cx,cy+(big?22:18),v,{fill:TX,fs:big?15:12.5,a:'start',w:big?700:500}));};
      cell(x+16,y+19,'TITLE',D.title.toUpperCase(),true);
      cell(x+16,y+58,'ASSEMBLY','Adjustable through-hole loop');
      cell(x+cols[1]+16,y+19,'MATERIAL',this.finishName());
      cell(x+cols[1]+16,y+58,'BAND','Silicone · hex 5 A/F @16.6');
      cell(x+cols[2]+16,y+19,'UNITS','mm');
      cell(x+cols[2]+16,y+58,'TOL','±0.1');
      cell(x+cols[3]+16,y+19,'PROJECTION','Third angle');
      cell(x+cols[3]+16,y+58,'SCALE','1:1 / detail');
      cell(x+cols[4]+16,y+19,'DWG No.','BC-00'+(design+1));
      cell(x+cols[4]+16,y+58,'REV','B  ·  '+(design+1)+'/3');
    })();

    A.push('</svg>'); return A.join('');
  }
}
